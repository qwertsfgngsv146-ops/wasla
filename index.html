    <!-- Firebase SDK Imports & Business Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            query, 
            orderBy, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDN7D0bW9I8rdKzVQ-VNJ9fuGsHg_r5Cpk",
            authDomain: "wasla-116e0.firebaseapp.com",
            projectId: "wasla-116e0",
            storageBucket: "wasla-116e0.firebasestorage.app",
            messagingSenderId: "469724595553",
            appId: "1:469724595553:web:9b206387d60896a7bbb120",
            measurementId: "G-H4J2Y2Y965"
        };

        // Initialize Firebase
        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("Wasla Firebase Engine Initialized Successfully.");
        } catch (err) {
            console.error("Firebase Initialization Error:", err);
        }

        const contactForm = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');
        const formSuccess = document.getElementById('formSuccess');
        const formError = document.getElementById('formError');

        // Form Submit Handler
        if (contactForm) {
            contactForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                // 1. Lock UI Button
                if (submitBtn) submitBtn.disabled = true;
                if (btnSpinner) btnSpinner.classList.remove('hidden');
                if (btnText) btnText.innerText = 'جاري الإرسال...';
                if (formSuccess) formSuccess.classList.add('hidden');
                if (formError) formError.classList.add('hidden');

                const payload = {
                    name: document.getElementById('fullName')?.value?.trim() || '',
                    company: document.getElementById('companyName')?.value?.trim() || '',
                    phone: document.getElementById('phone')?.value?.trim() || '',
                    email: document.getElementById('email')?.value?.trim() || '',
                    message: document.getElementById('message')?.value?.trim() || '',
                    createdAt: new Date().toLocaleString('ar-EG'),
                    dateIso: new Date().toISOString()
                };

                let savedToFirestore = false;

                try {
                    if (db) {
                        // 6 seconds max timeout for cloud request
                        const timeoutPromise = new Promise((_, reject) => 
                            setTimeout(() => reject(new Error("Timeout")), 6000)
                        );

                        const firestorePromise = addDoc(collection(db, "contacts"), {
                            ...payload,
                            timestamp: serverTimestamp()
                        });

                        await Promise.race([firestorePromise, timeoutPromise]);
                        savedToFirestore = true;
                    }
                } catch (err) {
                    console.warn("Firestore save fallback triggered:", err.message);
                } finally {
                    // Always save local backup for instant Admin visibility
                    saveLocalContact(payload);

                    // 2. Unlock UI Button
                    if (submitBtn) submitBtn.disabled = false;
                    if (btnSpinner) btnSpinner.classList.add('hidden');
                    if (btnText) btnText.innerText = 'إرسال الطلب';

                    // 3. Show Success View
                    if (formSuccess) {
                        formSuccess.classList.remove('hidden');
                    }
                    contactForm.reset();

                    // Refresh Admin Panel View if active
                    if (typeof window.renderAdminTable === 'function') {
                        window.renderAdminTable();
                    }
                }
            });
        }

        // Backup Storage Helper
        function saveLocalContact(data) {
            try {
                const list = JSON.parse(localStorage.getItem('wasla_contacts') || '[]');
                list.unshift(data);
                localStorage.setItem('wasla_contacts', JSON.stringify(list));
            } catch (e) {
                console.error("Local storage error:", e);
            }
        }

        // Live Realtime Firestore Sync to Admin Table
        if (db) {
            try {
                const q = query(collection(db, "contacts"), orderBy("timestamp", "desc"));
                onSnapshot(q, (snapshot) => {
                    const items = [];
                    snapshot.forEach((doc) => {
                        items.push({ id: doc.id, ...doc.data() });
                    });
                    window.firestoreContacts = items;
                    if (typeof window.renderAdminTable === 'function') {
                        window.renderAdminTable();
                    }
                }, (err) => console.warn("Firestore snapshot listener:", err));
            } catch (err) {
                console.warn("Snapshot query setup error:", err);
            }
        }
    </script>
